params:
  cosi:
    latex: \mathrm{cos}(i)
    prior:
      max: 0.999
      min: 0.001
    ref:
      dist: norm
      loc: 0.5
      proposal: 0.001
      scale: 0.001
  eint1:
    derived: 'lambda cosi, theta_int: np.tan(0.5*np.arccos(cosi)) * np.cos(2*theta_int)'
    latex: e^\mathrm{int}_1
  eint2:
    derived: 'lambda cosi, theta_int: np.tan(0.5*np.arccos(cosi)) * np.sin(2*theta_int)'
    latex: e^\mathrm{int}_2
  em_Ha_flux:
    latex: F_\mathrm{H\alpha}
    prior:
      max: 1.3274841846274571e-15
      min: 1.3274841846274571e-17
    ref:
      dist: norm
      loc: 2.8e-16
      proposal: 1.0e-17
      scale: 1.0e-17
  em_Ha_hlr:
    latex: R_h^{H\alpha}
    prior:
      max: 1.0
      min: 0.01
    ref:
      dist: norm
      loc: 0.3
      proposal: 0.0001
      scale: 0.01
  em_Ha_sigma:
    latex: \sigma_{H\alpha}
    prior:
      max: 0.438
      min: 0.043
    ref:
      dist: norm
      loc: 0.175
      proposal: 0.0001
      scale: 0.01
  flux:
    latex: F_\mathrm{phot}
    prior:
      max: 146.0428126985689
      min: 1.460428126985689
    ref:
      dist: norm
      loc: 768
      proposal: 0.0001
      scale: 0.1
  g:
    derived: 'lambda g1, g2: np.sqrt(g1*g1 + g2*g2)'
    latex: g
    prior:
      clip_sigmas: 3
      dist: norm
      loc: 0.0
      scale: 0.3
  g1:
    latex: g_1
    prior:
      max: 0.3
      min: -0.3
    ref:
      dist: norm
      loc: 0.0
      proposal: 0.0001
      scale: 0.1
  g2:
    latex: g_2
    prior:
      max: 0.3
      min: -0.3
    ref:
      dist: norm
      loc: 0.0
      proposal: 0.0001
      scale: 0.1
  hlr:
    latex: R_h
    prior:
      max: 1.0
      min: 0.01
    ref:
      dist: norm
      loc: 0.232
      proposal: 0.0001
      scale: 0.01
  rscale:
    latex: R_\mathrm{vscale}
    prior:
      max: 1.0
      min: 0.001
    ref:
      dist: norm
      loc: 0.05
      proposal: 0.0001
      scale: 0.0001
  theta_int:
    latex: \theta_\mathrm{int}
    prior:
      max: 3.1415926
      min: -3.1415926
    ref:
      dist: norm
      loc: 0.936227
      proposal: 0.001
      scale: 0.001
  v22:
    derived: 'lambda vcirc, hlr, rscale: vcirc/(np.pi/2.)*np.arctan(1.3*hlr/rscale)'
    latex: V_{2.2}
    prior:
      clip_sigmas: 3
      dex: 0.0749
      dist: lognorm
      mu: 225.23
  vcirc:
    latex: v_\mathrm{circ}
    prior:
      max: 800
      min: 80
    ref:
      dist: norm
      loc: 250.23
      proposal: 0.0001
      scale: 1
